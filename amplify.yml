version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile --network-timeout 600000
    build:
      commands:
        - rm -f .env.production
        - |
          node <<'NODE'
          const fs = require("fs");

          const requiredKeys = [
            "RESEND_API_KEY",
            "CONTACT_TO_EMAIL",
            "CONTACT_FROM_EMAIL",
            "LIVEKIT_API_KEY",
            "LIVEKIT_API_SECRET",
            "NEXT_PUBLIC_LIVEKIT_URL",
          ];
          const missingKeys = requiredKeys.filter((key) => !process.env[key]?.trim());

          if (missingKeys.length > 0) {
            console.error(`Missing required Amplify environment variables: ${missingKeys.join(", ")}`);
            process.exit(1);
          }

          const selectedKeys = [
            ...requiredKeys,
            ...Object.keys(process.env)
              .filter((key) => key.startsWith("NEXT_PUBLIC_"))
              .sort(),
          ].filter((key, index, keys) => keys.indexOf(key) === index);

          const envFile = selectedKeys
            .map((key) => `${key}=${JSON.stringify(process.env[key])}`)
            .join("\n");

          fs.writeFileSync(".env.production", `${envFile}\n`, { encoding: "utf8", mode: 0o600 });
          console.log(`Prepared .env.production with ${selectedKeys.length} selected variables.`);
          NODE
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
