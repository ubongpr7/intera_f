name: intera-frontend-backends

x-django-api-health: &django_api_health
  interval: 10s
  timeout: 15s
  retries: 30
  start_period: 180s

x-worker-env: &worker_env
  DEBUG: "True"
  LOCAL_SERVER: "True"
  JWT_ALGORITHM: RS256
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_USE_OUTBOX: "false"

x-ka2a-env: &ka2a_env
  KA2A_BOOTSTRAP_SERVERS: kafka:9092
  KA2A_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KA2A_KAFKA_SASL_MECHANISM: ""
  KA2A_KAFKA_SASL_USERNAME: ""
  KA2A_KAFKA_SASL_PASSWORD: ""
  KA2A_KAFKA_SSL_CHECK_HOSTNAME: "false"
  KA2A_CONTROL_PLANE_BASE_URL: http://ka2a_gateway:7006
  KA2A_CONTROL_PLANE_TIMEOUT_S: "60"
  KA2A_RUNTIME_SHARED_TOKEN: local-ka2a-runtime-token
  KA2A_DATA_DIR: /app/.data
  KA2A_CONTROL_PLANE_STORE_PATH: /app/.data/control_plane.json
  KA2A_TASK_STORE: redis
  KA2A_CHAT_STORE: redis
  KA2A_REDIS_URL: redis://redis:6379/0
  KA2A_TOOLS_ENABLED: "false"
  KA2A_TOOLS_SOURCE: "off"
  KA2A_GATEWAY_REQUEST_TIMEOUT_S: "30"
  KA2A_PROXY_REQUEST_TIMEOUT_S: "30"
  KA2A_CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
  KA2A_CORS_ALLOW_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1)(:\d+)?$
  KA2A_CORS_ALLOW_CREDENTIALS: "true"
  KA2A_CORS_ALLOW_HEADERS: Authorization,Content-Type,X-Requested-With,X-Profile-ID,X-Company-Code,X-Device-ID
  KA2A_JWT_ENABLED: "true"
  KA2A_JWT_ALGORITHMS: RS256
  KA2A_JWT_USER_CLAIM: user_id
  KA2A_JWT_TENANT_CLAIM: profile_id
  KA2A_JWT_FORWARD_BEARER_TOKEN: "true"
  KA2A_JWT_INCLUDE_CLAIMS: "true"
  SUBSCRIPTION_SERVICE_URL: http://subscriptions:8550

services:
  redis:
    image: redis:7-alpine
    container_name: intera-redis-shared
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: ubongpr7/intera-kafka:dev
    container_name: intera-kafka-shared
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 9092), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  kafka_topics_init:
    image: confluentinc/cp-kafka:7.8.3
    container_name: intera-kafka-topics-init-shared
    command: >-
      bash -lc 'set -euo pipefail;
      bootstrap_server="kafka:9092";
      topics=(identity.user identity.company_profile identity.membership catalog.product catalog.variant inventory.availability inventory.reservation inventory.fulfillment inventory.purchase_price pos.order audit_events notification_events support_access_events ka2a.registry ka2a.dlq ka2a.req.host ka2a.reply.gateway ka2a.reply.proxy ka2a.reply.host-delegator);
      echo "Waiting for Kafka at $${bootstrap_server}";
      cub kafka-ready -b "$${bootstrap_server}" 1 120;
      for topic in "$${topics[@]}"; do
        echo "Ensuring topic $${topic}";
        kafka-topics --bootstrap-server "$${bootstrap_server}" --create --if-not-exists --replication-factor 1 --partitions 1 --topic "$${topic}" || true;
        echo "Ensuring topic $${topic}.dlq";
        kafka-topics --bootstrap-server "$${bootstrap_server}" --create --if-not-exists --replication-factor 1 --partitions 1 --topic "$${topic}.dlq" || true;
      done;
      echo "Kafka topic bootstrap complete."'
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  ka2a_topics_init:
    image: ubongpr7/intera-ka2a:dev
    container_name: intera-ka2a-topics-init-shared
    env_file:
      - ./backend-env/ka2a.env
    environment:
      <<: *ka2a_env
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      attempt=1;
      until ka2a ensure-topics
      --agents 'host'
      --client-ids 'gateway,proxy,host-delegator';
      do
        if [ "$$attempt" -ge 12 ]; then
          echo 'ka2a ensure-topics failed after retries' >&2;
          exit 1;
        fi;
        echo "ka2a ensure-topics retry $$attempt/12" >&2;
        attempt=$$((attempt+1));
        sleep 5;
      done
    depends_on:
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: "no"

  ka2a_gateway:
    image: ubongpr7/intera-ka2a:dev
    container_name: intera-ka2a-gateway-shared
    env_file:
      - ./backend-env/ka2a.env
    environment:
      <<: *ka2a_env
    command: ["gateway", "--default-agent", "host", "--host", "0.0.0.0", "--port", "7006"]
    ports:
      - "7006:7006"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7006/health', timeout=15).read()\"",
        ]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
      ka2a_topics_init:
        condition: service_completed_successfully
      users:
        condition: service_healthy
      subscriptions:
        condition: service_healthy
    restart: unless-stopped

  ka2a_runtime:
    image: ubongpr7/intera-ka2a:dev
    container_name: intera-ka2a-runtime-shared
    env_file:
      - ./backend-env/ka2a.env
    environment:
      <<: *ka2a_env
    command: ["runtime"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ka2a_gateway:
        condition: service_healthy
      ka2a_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  ka2a_proxy:
    image: ubongpr7/intera-ka2a:dev
    container_name: intera-ka2a-proxy-shared
    env_file:
      - ./backend-env/ka2a.env
    environment:
      <<: *ka2a_env
    command: ["proxy", "--agent-name", "host", "--host", "0.0.0.0", "--port", "7007"]
    ports:
      - "7007:7007"
    depends_on:
      ka2a_runtime:
        condition: service_started
    restart: unless-stopped

  subscriptions:
    image: ubongpr7/intera-subscriptions:dev
    container_name: intera-subscriptions-shared
    env_file:
      - ./backend-env/subscriptions.env
    environment:
      DEBUG: "True"
      JWT_ALGORITHM: RS256
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    ports:
      - "8550:8550"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8550/healthz/', timeout=15).read()\"",
        ]
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8550"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  users:
    image: ubongpr7/intera-users:dev
    container_name: intera-users-shared
    env_file:
      - ./backend-env/users.env
    environment:
      DEBUG: "True"
      LOCAL_SERVER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,users,host.docker.internal
      AUTH_COOKIE_SECURE: "False"
      AUTH_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_SSL_REDIRECT: "False"
      SECURE_PROXY_SSL_HEADER_ENABLED: "False"
      CORS_ALLOW_ALL_ORIGINS: "True"
      CORS_ALLOW_CREDENTIALS: "True"
      JWT_ALGORITHM: RS256
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USE_OUTBOX: "false"
      SUBSCRIPTION_SERVICE_URL: http://subscriptions:8550
      SUBSCRIPTION_ENFORCEMENT_MODE: enforce
      SUBSCRIPTION_SERVICE_TIMEOUT: "10.0"
    ports:
      - "7001:7001"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/healthz/', timeout=15).read()\"",
        ]
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/uvicorn core.asgi:application --host 0.0.0.0 --port 7001"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
      subscriptions:
        condition: service_healthy
    restart: unless-stopped

  users_consumer:
    image: ubongpr7/intera-users:dev
    container_name: intera-users-consumer-shared
    env_file:
      - ./backend-env/users.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py consume_kafka"
    depends_on:
      users:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  users_outbox:
    image: ubongpr7/intera-users:dev
    container_name: intera-users-outbox-shared
    env_file:
      - ./backend-env/users.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py publish_outbox_events"
    depends_on:
      users:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  inventory:
    image: ubongpr7/intera-inventory:dev
    container_name: intera-inventory-shared
    env_file:
      - ./backend-env/inventory.env
    environment:
      DEBUG: "True"
      LOCAL_SERVER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,inventory,host.docker.internal
      JWT_ALGORITHM: RS256
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USE_OUTBOX: "false"
      SUBSCRIPTION_SERVICE_URL: http://subscriptions:8550
      SUBSCRIPTION_ENFORCEMENT_MODE: enforce
      SUBSCRIPTION_SERVICE_TIMEOUT: "10.0"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "7002:7002"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7002/healthz/', timeout=15).read()\"",
        ]
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/uvicorn core.asgi:application --host 0.0.0.0 --port 7002"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
      subscriptions:
        condition: service_healthy
    restart: unless-stopped

  inventory_consumer:
    image: ubongpr7/intera-inventory:dev
    container_name: intera-inventory-consumer-shared
    env_file:
      - ./backend-env/inventory.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py consume_kafka"
    depends_on:
      inventory:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  inventory_outbox:
    image: ubongpr7/intera-inventory:dev
    container_name: intera-inventory-outbox-shared
    env_file:
      - ./backend-env/inventory.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py publish_outbox_events"
    depends_on:
      inventory:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  products:
    image: ubongpr7/intera-products:dev
    container_name: intera-products-shared
    env_file:
      - ./backend-env/products.env
    environment:
      DEBUG: "True"
      LOCAL_SERVER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,products,host.docker.internal
      JWT_ALGORITHM: RS256
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USE_OUTBOX: "false"
      SUBSCRIPTION_SERVICE_URL: http://subscriptions:8550
      SUBSCRIPTION_ENFORCEMENT_MODE: enforce
      SUBSCRIPTION_SERVICE_TIMEOUT: "10.0"
    ports:
      - "7003:7003"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7003/healthz/', timeout=15).read()\"",
        ]
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/uvicorn core.asgi:application --host 0.0.0.0 --port 7003"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
      subscriptions:
        condition: service_healthy
    restart: unless-stopped

  product_consumer:
    image: ubongpr7/intera-products:dev
    container_name: intera-products-consumer-shared
    env_file:
      - ./backend-env/products.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py consume_kafka"
    depends_on:
      products:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  product_outbox:
    image: ubongpr7/intera-products:dev
    container_name: intera-products-outbox-shared
    env_file:
      - ./backend-env/products.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py publish_outbox_events"
    depends_on:
      products:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  pos:
    image: ubongpr7/intera-pos-backend:dev
    container_name: intera-pos-shared
    env_file:
      - ./backend-env/pos.env
    environment:
      DEBUG: "True"
      LOCAL_SERVER: "True"
      JWT_ALGORITHM: RS256
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_USE_OUTBOX: "false"
      SUBSCRIPTION_SERVICE_URL: http://subscriptions:8550
      SUBSCRIPTION_ENFORCEMENT_MODE: enforce
      SUBSCRIPTION_SERVICE_TIMEOUT: "10.0"
    ports:
      - "7004:7004"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7004/healthz/', timeout=15).read()\"",
        ]
    command: >
      sh -c "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/uvicorn core.asgi:application --host 0.0.0.0 --port 7004"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
      subscriptions:
        condition: service_healthy
    restart: unless-stopped

  pos_consumer:
    image: ubongpr7/intera-pos-backend:dev
    container_name: intera-pos-consumer-shared
    env_file:
      - ./backend-env/pos.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py consume_kafka"
    depends_on:
      pos:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  pos_outbox:
    image: ubongpr7/intera-pos-backend:dev
    container_name: intera-pos-outbox-shared
    env_file:
      - ./backend-env/pos.env
    environment: *worker_env
    command: sh -c "/app/.venv/bin/python manage.py publish_outbox_events"
    depends_on:
      pos:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  audit:
    image: ubongpr7/intera-audit-service:dev
    container_name: intera-audit-shared
    env_file:
      - ./backend-env/audit.env
    environment:
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8091
      AUTO_CREATE_TABLES: "true"
      SQL_ECHO: "false"
      AUTH_COOKIE_NAMES: accessToken
      JWT_ALGORITHM: RS256
      REALTIME_REDIS_URL: redis://redis:6379/6
      REALTIME_REDIS_CHANNEL: inventory.audit.realtime
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CONSUMER_TOPICS: audit_events,support_access_events,identity.user,identity.company_profile,identity.membership,catalog.product,catalog.variant,inventory.availability,inventory.reservation,inventory.fulfillment,inventory.purchase_price,pos.order
    ports:
      - "8091:8091"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=15).read()\"",
        ]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

  notification:
    image: ubongpr7/intera-notification-service:dev
    container_name: intera-notification-shared
    env_file:
      - ./backend-env/notification.env
    environment:
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8092
      AUTO_CREATE_TABLES: "true"
      SQL_ECHO: "false"
      AUTH_COOKIE_NAMES: accessToken
      JWT_ALGORITHM: RS256
      REALTIME_REDIS_URL: redis://redis:6379/7
      REALTIME_REDIS_CHANNEL: inventory.notification.realtime
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_CONSUMER_TOPICS: identity.user,identity.company_profile,identity.membership,inventory.availability,notification_events,support_access_events
    ports:
      - "8092:8092"
    healthcheck:
      <<: *django_api_health
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=15).read()\"",
        ]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_topics_init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka_data:
  redis_data:
